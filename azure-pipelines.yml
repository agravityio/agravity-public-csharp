trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

variables:
  BuildConfiguration: Release
  DotNetSdkVersion: 10.0.x
  SolutionFile: Agravity.Public.sln
  PackProject: src/Agravity.Public/Agravity.Public.csproj
  ArtifactName: nuget-packages
  PackageOutputDirectory: $(Build.ArtifactStagingDirectory)/packages
  AzureServiceConnection: agravity-public-oidc
  KeyVaultName: agravity-public-release-kv
  NuGetApiKeySecretName: nuget-org-api-key

stages:
  - stage: Validate
    displayName: Validate, test, and pack
    jobs:
      - job: BuildTestPack
        displayName: Build, test, and pack
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(DotNetSdkVersion)

          - task: PowerShell@2
            displayName: Resolve package version
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $sourceBranch = '$(Build.SourceBranch)'
                if ($sourceBranch.StartsWith('refs/tags/v')) {
                  $packageVersion = $sourceBranch.Substring(11)
                }
                else {
                  [xml]$projectFile = Get-Content '$(PackProject)'
                  $packageVersion = ($projectFile.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
                }

                if ([string]::IsNullOrWhiteSpace($packageVersion)) {
                  throw 'Package version could not be resolved.'
                }

                Write-Host "##vso[task.setvariable variable=PackageVersion]$packageVersion"

          - task: PowerShell@2
            displayName: Restore solution in locked mode
            inputs:
              targetType: inline
              pwsh: true
              script: |
                dotnet restore '$(SolutionFile)' --locked-mode /p:Version=$(PackageVersion) /p:ContinuousIntegrationBuild=true

          - task: PowerShell@2
            displayName: Build solution
            inputs:
              targetType: inline
              pwsh: true
              script: |
                dotnet build '$(SolutionFile)' --configuration $(BuildConfiguration) --no-restore /p:Version=$(PackageVersion) /p:ContinuousIntegrationBuild=true

          - task: PowerShell@2
            displayName: Run tests
            inputs:
              targetType: inline
              pwsh: true
              script: |
                dotnet test '$(SolutionFile)' --configuration $(BuildConfiguration) --no-build --logger trx

          - task: PowerShell@2
            displayName: Pack NuGet package
            inputs:
              targetType: inline
              pwsh: true
              script: |
                New-Item -ItemType Directory -Path '$(PackageOutputDirectory)' -Force | Out-Null
                dotnet pack '$(PackProject)' --configuration $(BuildConfiguration) --no-build --output '$(PackageOutputDirectory)' /p:Version=$(PackageVersion) /p:ContinuousIntegrationBuild=true

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              failTaskOnFailedTests: true

          - publish: $(PackageOutputDirectory)
            displayName: Publish package artifacts
            artifact: $(ArtifactName)

  - stage: Publish
    displayName: Publish to NuGet
    dependsOn: Validate
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: PushPackages
        displayName: Push packages to nuget.org
        pool:
          vmImage: windows-latest
        steps:
          - checkout: none

          - download: current
            displayName: Download package artifacts
            artifact: $(ArtifactName)

          - task: AzureCLI@2
            displayName: Read NuGet API key from Azure Key Vault
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $nugetApiKey = az keyvault secret show --vault-name "$(KeyVaultName)" --name "$(NuGetApiKeySecretName)" --query value --output tsv
                if ([string]::IsNullOrWhiteSpace($nugetApiKey)) {
                  throw 'The NuGet API key secret is empty or missing.'
                }

                Write-Host "##vso[task.setvariable variable=NuGetApiKey;issecret=true]$nugetApiKey"

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(DotNetSdkVersion)

          - task: PowerShell@2
            displayName: Push packages
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $packageRoot = '$(Pipeline.Workspace)/$(ArtifactName)'
                $packages = Get-ChildItem -Path $packageRoot -Filter *.nupkg | Where-Object { $_.Name -notlike '*.snupkg' }

                if (-not $packages) {
                  throw 'No .nupkg files were found to publish.'
                }

                foreach ($package in $packages) {
                  dotnet nuget push $package.FullName --source 'https://api.nuget.org/v3/index.json' --api-key '$(NuGetApiKey)' --skip-duplicate
                }