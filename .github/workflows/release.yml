name: Build and publish NuGet package

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
      - "*.*.*-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: Agravity.Public.sln
  PACK_PROJECT: src/Agravity.Public/Agravity.Public.csproj
  PACKAGE_OUTPUT_DIRECTORY: artifacts/packages

jobs:
  validate:
    name: Build, test, and pack
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Prepare release ')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $packageVersion = '${{ github.ref_name }}'
          }
          else {
            [xml]$projectFile = Get-Content '${{ env.PACK_PROJECT }}'
            $packageVersion = ($projectFile.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }

          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw 'Package version could not be resolved.'
          }

          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore solution in locked mode
        shell: pwsh
        run: |
          dotnet restore '${{ env.SOLUTION_FILE }}' --locked-mode /p:Version=${{ steps.version.outputs.package_version }} /p:ContinuousIntegrationBuild=true

      - name: Build solution
        shell: pwsh
        run: |
          dotnet build '${{ env.SOLUTION_FILE }}' --configuration '${{ env.BUILD_CONFIGURATION }}' --no-restore /p:Version=${{ steps.version.outputs.package_version }} /p:ContinuousIntegrationBuild=true

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test '${{ env.SOLUTION_FILE }}' --configuration '${{ env.BUILD_CONFIGURATION }}' --no-build --logger trx --results-directory artifacts/test-results

      - name: Pack NuGet package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '${{ env.PACKAGE_OUTPUT_DIRECTORY }}' -Force | Out-Null
          dotnet pack '${{ env.PACK_PROJECT }}' --configuration '${{ env.BUILD_CONFIGURATION }}' --no-build --output '${{ env.PACKAGE_OUTPUT_DIRECTORY }}' /p:Version=${{ steps.version.outputs.package_version }} /p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-24.04
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet login with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Agravity-Philipp

      - name: Publish package to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -Path '${{ env.PACKAGE_OUTPUT_DIRECTORY }}' -Filter *.nupkg | Where-Object { $_.Name -notlike '*.snupkg' }

          if (-not $packages) {
            throw 'No .nupkg files were found to publish.'
          }

          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The temporary NuGet API key was not retrieved through OIDC.'
          }

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          }
